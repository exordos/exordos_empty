name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'

env:
  ARTIFACTS_PATH: artifacts
  PACKER_VERSION: "1.9.2"
  PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
  USERNAME: ${{ secrets.TEST_USERNAME }}
  USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
  ENDPOINT: https://exordos.com/api/core
  ELEMENT_NAME: empty
  REALM_TTL_HOURS: "2"
  # PACKER_LOG: 1

jobs:
  BuildTestPush:
    runs-on: ubuntu-24.04
    if : ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Install exordos
        run: curl -fsSL https://repo.exordos.com/install.sh | sh
      - name: Install hypervisor
        run: |
          EXORDOS_BIN=$(which exordos)
          sudo $EXORDOS_BIN compute hypervisors init
          sudo chmod +666 /dev/kvm
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout the realm scripts
        uses: actions/checkout@v7
        with:
          repository: exordos/exordos_tests
          path: exordos_tests
      - name: Build Exordos Empty
        timeout-minutes: 10
        env:
          PUSH_EXORDOS_CFG: ${{ secrets.PUSH_EXORDOS_CFG }}
        run: |
          set -eux

          mkdir -p ${ARTIFACTS_PATH}

          VERSION="$(exordos get-version .)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          exordos build $(pwd)

          echo "$PUSH_EXORDOS_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t exordos_repo -f --latest
      - name: get_realm
        timeout-minutes: 15
        working-directory: exordos_tests
        run: |
          set -euo pipefail

          REALM_NAME="empty-build-${{ github.run_id }}"
          echo "REALM_NAME=$REALM_NAME" >> "$GITHUB_ENV"

          got="$(.github/scripts/get-realm.sh "$REALM_NAME" "$REALM_TTL_HOURS")"

          echo "::add-mask::$(echo "$got" | sed -n 's/^ADMIN_PASSWORD=//p')"
          echo "$got" >> "$GITHUB_ENV"
          echo "$got" | grep -v '^ADMIN_PASSWORD='
      - name: wait_for_realm_api
        timeout-minutes: 10
        run: |
          set -uo pipefail

          for i in $(seq 1 60); do
              for scheme in https http; do
                  url="$scheme://$REALM_DOMAIN/api/core"
                  if exordos --endpoint "$url" --user admin \
                             --password "$ADMIN_PASSWORD" \
                             ready_api > /dev/null 2>&1; then
                      echo "REALM_CORE_URL=$url" >> "$GITHUB_ENV"
                      echo "The realm's core answered at $url"
                      exit 0
                  fi
              done
              echo "Waiting for the realm's core api... ($i/60)"
              sleep 5
          done

          echo "The realm's core answered on neither https nor http at" >&2
          echo "$REALM_DOMAIN" >&2
          exit 1
      - name: point_cli_at_the_realm
        run: |
          set -euo pipefail

          exordos settings set-realm default --endpoint "$REALM_CORE_URL"
          exordos settings set-context default --name default \
              --user admin --password "$ADMIN_PASSWORD"
      - name: wait_for_pushed_version
        timeout-minutes: 10
        run: |
          set -uo pipefail

          # The realm's repositories sync lazily, so the version pushed above
          # is not in its catalog until a refresh picks it up.  Refresh on
          # every round: the push may still be reaching the repo's mirror.
          for i in $(seq 1 60); do
              exordos repo refresh || true
              status="$(exordos repo e l --dev -f "name=$ELEMENT_NAME" -o json \
                  2>/dev/null | jq -r --arg v "$VERSION" \
                  '[.[] | select(.version == $v) | .status] | first // ""' \
                  2>/dev/null || true)"
              if [ "$status" = "AVAILABLE" ]; then
                  echo "$ELEMENT_NAME $VERSION is available in the realm"
                  exit 0
              fi
              echo "Waiting for $ELEMENT_NAME $VERSION... (${status:-not listed}, $i/60)"
              sleep 10
          done

          echo "$ELEMENT_NAME $VERSION never became available in the realm" >&2
          exordos repo l >&2 || true
          exordos repo e l --dev -f "name=$ELEMENT_NAME" >&2 || true
          exit 1
      - name: install_element
        run: |
          set -eux

          exordos e e install "$ELEMENT_NAME" -v "$VERSION"
      - name: check_element
        timeout-minutes: 10
        run: |
          set -eux

          exordos_tests/.github/scripts/wait-for-element.sh "$ELEMENT_NAME" 540

          installed="$(exordos ee l -o json -f "name=$ELEMENT_NAME" | jq -r '.[0].version')"
          if [ "$installed" != "$VERSION" ]; then
              echo "Installed $installed instead of $VERSION" >&2
              exit 1
          fi

          exordos e e show "$ELEMENT_NAME"
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15
      - name: delete_realm
        if: ${{ always() }}
        run: |
          set -eux

          # Fall back to the name: an ordered realm that never came up leaves
          # get-realm.sh without printing its uuid, and it has no TTL.
          realm="${REALM_UUID:-${REALM_NAME:-}}"
          if [ -z "$realm" ]; then
              echo "No realm was claimed, nothing to delete"
              exit 0
          fi
          exordos --endpoint "$ENDPOINT" --project-id "$PROJECT_ID" \
              --user "$USERNAME" --password "$USER_PASSWORD" \
              realms delete "$realm"
