<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Exordos Empty element">
  <title>Exordos Empty element</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a223a"/>
      <stop offset="1" stop-color="#0b0f1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e60b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2e60b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#3a486c" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- empty slot: a dashed placeholder frame -->
  <rect x="138" y="138" width="236" height="236" rx="34" fill="none"
        stroke="#6ea8ff" stroke-width="13" stroke-linecap="round"
        stroke-dasharray="46 30" stroke-dashoffset="23"/>

  <!-- ready to be filled -->
  <g fill="#56d6c9">
    <rect x="250" y="222" width="12" height="68" rx="6"/>
    <rect x="222" y="250" width="68" height="12" rx="6"/>
  </g>
</svg>
