# Build section. It specifies the build process of the project elements
build:

  # Dependencies of the project
  deps:
    - dst: /opt/empty
      # Local path
      path:
        src: ../exordos_empty

  # List of elements in the project
  elements:
    - manifest: exordos/manifests/empty.yaml.j2

      # Element store assets: icon and preview pictures
      artifacts:
        - path: exordos/artifacts/icon.svg
        - path: exordos/artifacts/icon.png
        - path: exordos/artifacts/preview-1.png
        - path: exordos/artifacts/preview-2.png

      images:
      - name: empty
        format: zst

        # OS profile for the image
        profile: exordos_base_minimal

        # Provisioning script
        script: exordos/images/install.sh

        # Override image build parameters, for instance Packer parameters
        override:
          # For development purposes it's handy to have more space.
          disk_size: "6G"
